# Базовая защита nginx от массовых сканеров/брутфорса (MVP).
#
# Как использовать:
# 1) Вставьте блок `limit_req_zone` в контекст `http {}` (обычно /etc/nginx/nginx.conf).
# 2) В server/location добавьте include с location-правилами ниже.

# --- http{} context ---
limit_req_zone $binary_remote_addr zone=zumbot_per_ip:10m rate=10r/s;

# --- server{} context ---
# Drop TRACE/TRACK (редко используются легитимно, часто в сканерах)
if ($request_method ~* "^(TRACE|TRACK)$") {
    return 405;
}

# Общий rate-limit для backend endpoint'ов
location = / {
    limit_req zone=zumbot_per_ip burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

location = /webhook {
    limit_req zone=zumbot_per_ip burst=10 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

location = /healthz {
    limit_req zone=zumbot_per_ip burst=30 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

location = /readyz {
    limit_req zone=zumbot_per_ip burst=30 nodelay;
    proxy_pass http://127.0.0.1:8000;
}

# Блокировка наиболее частых scanner probe path.
location ~* ^/(wp-admin|wp-login\.php|\.env|phpmyadmin|cgi-bin|vendor|actuator|\.git|boaform|HNAP1) {
    return 444;
}
