name: Manual VPS Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"
        type: string
      run_checks_only:
        description: "Run checks only (without deploy)"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input ref
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [[ ! "$INPUT_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid ref: '$INPUT_REF'. Allowed chars: A-Za-z0-9._/-"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy check or deploy script on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          RUN_CHECKS_ONLY: ${{ github.event.inputs.run_checks_only }}
        run: |
          set -euo pipefail

          if [[ "$RUN_CHECKS_ONLY" == "true" ]]; then
            REMOTE_SCRIPT="scripts/vps_deploy_check.sh"
          else
            REMOTE_SCRIPT="scripts/vps_deploy.sh"
          fi

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "sudo bash -lc 'cd /opt/zumbot/backend && git fetch origin && git checkout \"$INPUT_REF\" && bash $REMOTE_SCRIPT'"
