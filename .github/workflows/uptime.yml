name: Uptime Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest

    steps:
      - name: Check /readyz
        run: |
          set -euo pipefail
          url="https://api.zumbot.ru/readyz"
          response_file="$(mktemp)"

          echo "Uptime check URL: $url"

          status=$(curl -sS -o "$response_file" -w "%{http_code}" "$url" || true)

          echo "Uptime check HTTP status: $status"

          if [ "$status" != "200" ]; then
            echo "Unexpected status code: $status"
            echo "Response body (truncated):"
            head -c 500 "$response_file" || true
            exit 1
          fi

          echo "Uptime check passed."
