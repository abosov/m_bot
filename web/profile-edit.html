<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Профиль специалиста — Zumbot</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f6f7fb; color: #1f2937; }
    main { max-width: 820px; margin: 32px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 28px rgba(15,23,42,.08); }
    h1 { margin: 0 0 8px; }
    .subtitle { color: #4b5563; margin-bottom: 16px; }
    .status { margin: 0 0 18px; font-weight: 600; }
    .error { color: #b91c1c; }
    .ok { color: #166534; }
    .hidden { display: none; }
    .section { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .section h3 { margin: 0 0 10px; font-size: 16px; }
    .section-status { min-height: 22px; font-size: 14px; margin: 8px 0 0; }
    .section-status.error { color: #b91c1c; }
    .section-status.ok { color: #15803d; }
    label { display:block; font-size: 14px; color:#374151; margin-bottom: 8px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    button { border: 0; border-radius: 8px; background: #2563eb; color: #fff; padding: 10px 14px; font-weight: 600; cursor: pointer; }
    button[disabled] { opacity: .6; cursor: not-allowed; }
    .media-list { margin: 8px 0 0; padding-left: 18px; color: #334155; }
    .media-list li { margin-bottom: 4px; }
    @media (max-width: 760px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Профиль специалиста</h1>
    <p class="subtitle">Заполните информацию для публичной страницы</p>

    <p id="auth-loading" class="status">Проверяем авторизацию...</p>
    <p id="auth-ok" class="status ok hidden">✅ Авторизовано</p>
    <p id="auth-error" class="status error hidden">❌ Не удалось авторизоваться, откройте страницу из бота заново</p>

    <div id="profile-form" class="hidden">
      <div class="section">
        <h3>Основное</h3>
        <div class="row">
          <label>Имя <input id="first_name" type="text" placeholder="Имя" /></label>
          <label>Отчество (опционально) <input id="middle_name" type="text" placeholder="Отчество" /></label>
          <label>Фамилия <input id="last_name" type="text" placeholder="Фамилия" /></label>
        </div>
        <label>Специализация <input id="specialization" type="text" placeholder="Например: Психолог" /></label>
        <label>Цитата <textarea id="hero_quote" placeholder="Ваша цитата"></textarea></label>
        <div class="actions"><button id="save-main">Сохранить</button></div>
        <p id="status-main" class="section-status"></p>
      </div>

      <div class="section">
        <h3>О себе</h3>
        <textarea id="about" placeholder="Кратко о себе"></textarea>
        <div class="actions"><button id="save-about">Сохранить</button></div>
        <p id="status-about" class="section-status"></p>
      </div>

      <div class="section">
        <h3>Образование</h3>
        <textarea id="education" placeholder="Образование"></textarea>
        <div class="actions"><button id="save-education">Сохранить</button></div>
        <p id="status-education" class="section-status"></p>
      </div>

      <div class="section">
        <h3>Услуги и цены</h3>
        <textarea id="services" placeholder="Список услуг"></textarea>
        <div class="actions"><button id="save-services">Сохранить</button></div>
        <p id="status-services" class="section-status"></p>
      </div>

      <div class="section">
        <h3>Отзывы</h3>
        <textarea id="reviews" placeholder="Отзывы"></textarea>
        <div class="actions"><button id="save-reviews">Сохранить</button></div>
        <p id="status-reviews" class="section-status"></p>
      </div>

      <div class="section">
        <h3>Фото</h3>
        <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" />
        <div class="actions"><button id="upload-photo">Загрузить фото</button></div>
        <p id="status-photo" class="section-status"></p>
      </div>

      <div class="section">
        <h3>Документы</h3>
        <input id="documents-file" type="file" multiple accept="application/pdf,image/jpeg,image/png" />
        <div class="actions"><button id="upload-documents">Загрузить документы</button></div>
        <p id="status-documents" class="section-status"></p>
        <ul id="documents-list" class="media-list"></ul>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const loading = document.getElementById('auth-loading');
      const ok = document.getElementById('auth-ok');
      const error = document.getElementById('auth-error');
      const form = document.getElementById('profile-form');

      const state = {
        model: {
          first_name: '', middle_name: '', last_name: '', specialization: '', hero_quote: '',
          about: '', education: '', services: '', reviews: ''
        }
      };

      const fields = {
        first_name: document.getElementById('first_name'),
        middle_name: document.getElementById('middle_name'),
        last_name: document.getElementById('last_name'),
        specialization: document.getElementById('specialization'),
        hero_quote: document.getElementById('hero_quote'),
        about: document.getElementById('about'),
        education: document.getElementById('education'),
        services: document.getElementById('services'),
        reviews: document.getElementById('reviews'),
      };

      function getToken() {
        const hash = window.location.hash || '';
        const params = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
        return params.get('token') || params.get('t') || '';
      }

      function clearHash() {
        if (window.location.hash) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      }

      async function apiFetch(url, opts) {
        const res = await fetch(url, {
          credentials: 'include',
          ...opts,
        });
        let data = null;
        try { data = await res.json(); } catch (_) { data = null; }
        return { res, data };
      }

      async function consumeToken(token) {
        const { res, data } = await apiFetch('/auth/telegram/consume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        return res.ok && !!(data && data.ok);
      }

      async function checkSession() {
        const { res, data } = await apiFetch('/connect/status', { method: 'GET' });
        return res.ok && !!(data && data.ok);
      }

      function trimValue(value) {
        return (value || '').trim();
      }

      function applyModelToForm() {
        Object.keys(fields).forEach((key) => {
          fields[key].value = state.model[key] || '';
        });
      }

      async function loadProfile() {
        const { res, data } = await apiFetch('/api/specialist/profile', { method: 'GET' });
        if (!res.ok || !data) throw new Error('Не удалось загрузить профиль');
        state.model = {
          first_name: data.first_name || '',
          middle_name: data.middle_name || '',
          last_name: data.last_name || '',
          specialization: data.specialization || '',
          hero_quote: data.hero_quote || '',
          about: data.about || '',
          education: data.education || '',
          services: data.services || '',
          reviews: data.reviews || '',
        };
        applyModelToForm();
      }

      function setStatus(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text || '';
        el.classList.remove('ok', 'error');
        if (type) el.classList.add(type);
        if (type === 'ok') {
          setTimeout(() => {
            if (el.textContent === text) {
              el.textContent = '';
              el.classList.remove('ok');
            }
          }, 2500);
        }
      }

      function toggleButton(buttonId, disabled) {
        document.getElementById(buttonId).disabled = !!disabled;
      }

      async function saveBlock(buttonId, statusId, patch) {
        toggleButton(buttonId, true);
        setStatus(statusId, '', null);
        try {
          Object.keys(patch).forEach((key) => {
            patch[key] = trimValue(patch[key]);
          });
          const payload = { ...state.model, ...patch };
          const { res, data } = await apiFetch('/api/specialist/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!res.ok || !data) {
            const msg = data && data.detail ? String(data.detail) : 'Не удалось сохранить блок';
            setStatus(statusId, `Ошибка: ${msg}`, 'error');
            return;
          }
          state.model = { ...state.model, ...data };
          applyModelToForm();
          setStatus(statusId, 'Сохранено ✅', 'ok');
        } catch (_) {
          setStatus(statusId, 'Ошибка сети, попробуйте снова', 'error');
        } finally {
          toggleButton(buttonId, false);
        }
      }

      async function refreshMediaList() {
        const list = document.getElementById('documents-list');
        const { res, data } = await apiFetch('/api/specialist/profile/media', { method: 'GET' });
        if (!res.ok || !data || !Array.isArray(data.items)) {
          list.innerHTML = '<li>Не удалось загрузить список файлов</li>';
          return;
        }
        const docs = data.items.filter((item) => item.media_type === 'document');
        if (!docs.length) {
          list.innerHTML = '<li>Документы ещё не загружены</li>';
          return;
        }
        list.innerHTML = docs
          .map((item) => `<li>${item.title || 'Документ'} · порядок: ${item.sort_order}</li>`)
          .join('');
      }

      async function uploadPhoto() {
        const input = document.getElementById('photo-file');
        const file = input.files && input.files[0];
        if (!file) {
          setStatus('status-photo', 'Выберите файл фото', 'error');
          return;
        }
        toggleButton('upload-photo', true);
        setStatus('status-photo', '', null);
        try {
          const formData = new FormData();
          formData.append('file', file);
          const { res, data } = await apiFetch('/api/specialist/profile/photo', {
            method: 'POST',
            body: formData,
          });
          if (!res.ok) {
            const msg = data && data.detail ? String(data.detail) : 'Не удалось загрузить фото';
            setStatus('status-photo', `Ошибка: ${msg}`, 'error');
            return;
          }
          input.value = '';
          setStatus('status-photo', 'Сохранено ✅', 'ok');
          await refreshMediaList();
        } catch (_) {
          setStatus('status-photo', 'Ошибка сети, попробуйте снова', 'error');
        } finally {
          toggleButton('upload-photo', false);
        }
      }

      async function uploadDocuments() {
        const input = document.getElementById('documents-file');
        const files = Array.from(input.files || []);
        if (!files.length) {
          setStatus('status-documents', 'Выберите один или несколько файлов', 'error');
          return;
        }
        toggleButton('upload-documents', true);
        setStatus('status-documents', '', null);
        let uploaded = 0;
        try {
          for (const file of files) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('title', trimValue(file.name));
            const { res, data } = await apiFetch('/api/specialist/profile/documents', {
              method: 'POST',
              body: formData,
            });
            if (!res.ok) {
              const msg = data && data.detail ? String(data.detail) : 'Ошибка загрузки документа';
              setStatus('status-documents', `Ошибка: ${msg}`, 'error');
              return;
            }
            uploaded += 1;
          }
          input.value = '';
          setStatus('status-documents', `Сохранено ✅ (${uploaded})`, 'ok');
          await refreshMediaList();
        } catch (_) {
          setStatus('status-documents', 'Ошибка сети, попробуйте снова', 'error');
        } finally {
          toggleButton('upload-documents', false);
        }
      }

      async function init() {
        try {
          const token = getToken();
          let authorized = false;

          if (token) {
            authorized = await consumeToken(token);
            if (authorized) clearHash();
          }

          if (!authorized) authorized = await checkSession();

          loading.classList.add('hidden');
          if (!authorized) {
            error.classList.remove('hidden');
            return;
          }

          ok.classList.remove('hidden');
          form.classList.remove('hidden');
          await loadProfile();
          await refreshMediaList();

          document.getElementById('save-main').addEventListener('click', () => saveBlock('save-main', 'status-main', {
            first_name: fields.first_name.value,
            middle_name: fields.middle_name.value,
            last_name: fields.last_name.value,
            specialization: fields.specialization.value,
            hero_quote: fields.hero_quote.value,
          }));
          document.getElementById('save-about').addEventListener('click', () => saveBlock('save-about', 'status-about', {
            about: fields.about.value,
          }));
          document.getElementById('save-education').addEventListener('click', () => saveBlock('save-education', 'status-education', {
            education: fields.education.value,
          }));
          document.getElementById('save-services').addEventListener('click', () => saveBlock('save-services', 'status-services', {
            services: fields.services.value,
          }));
          document.getElementById('save-reviews').addEventListener('click', () => saveBlock('save-reviews', 'status-reviews', {
            reviews: fields.reviews.value,
          }));
          document.getElementById('upload-photo').addEventListener('click', uploadPhoto);
          document.getElementById('upload-documents').addEventListener('click', uploadDocuments);
        } catch (_) {
          loading.classList.add('hidden');
          form.classList.add('hidden');
          error.classList.remove('hidden');
        }
      }

      init();
    })();
  </script>
</body>
</html>
