<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Контакты — Zumbot</title>

    <!-- Global favicon -->
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
<link rel="stylesheet" href="assets/styles.css" /></head>
  <body>
    {{SITE_HEADER}}
    <main class="wrap page">
      <h1>Контакты</h1>
      <section class="card contacts"><p>Email: <a href="mailto:info@zumbot.ru">info@zumbot.ru</a></p><p>Telegram: <a href="https://t.me/zumhelper_bot">@zumhelper_bot</a></p></section>
      <section class="card">
        <h2>Связаться с нами</h2>
        <form class="contact-form" id="contact-form" action="javascript:void(0)" method="post">
          <label>Имя<input type="text" name="name" id="contact-name" placeholder="Ваше имя" /></label>
          <label>Email<input type="email" name="email" id="contact-email" placeholder="you@company.ru" /></label>
          <label>Сообщение<textarea rows="4" name="message" id="contact-message" placeholder="Опишите задачу"></textarea></label>
          <input type="text" name="hp" id="contact-hp" autocomplete="off" tabindex="-1" style="display:none" />
          <button class="button" type="submit">Отправить</button>
          <p id="contact-status" class="form-status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    {{SITE_FOOTER}}
    <script src="assets/app.js"></script>
  </body>
</html>
