# Public site routing for zumbot.ru
#
# Include this file inside the `server { ... }` block for zumbot.ru.
# It preserves API/static routes and enables SPA fallback for specialist slugs
# like /TsarevaE_12.

# API must stay on backend and never fall back to SPA.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Static files from site root.
location ^~ /static/ {
    root /opt/zumbot/backend/web;
    try_files $uri =404;
}

location ^~ /assets/ {
    root /opt/zumbot/backend/web;
    try_files $uri =404;
}

# Explicit public pages with dedicated static html files.
location = /privacy { try_files /privacy.html =404; }
location = /terms { try_files /terms.html =404; }
location = /revoke-access { try_files /revoke-access.html =404; }
location = /pricing { try_files /pricing.html =404; }

# SPA fallback for unknown site paths (e.g. /TsarevaE_12).
# This allows frontend router to resolve public specialist slugs.
location / {
    root /opt/zumbot/backend/web;
    try_files $uri $uri/ /index.html;
}
