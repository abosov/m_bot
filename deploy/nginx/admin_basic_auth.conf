# US-AD-9 Admin Console edge protection.
#
# Include this file inside the relevant nginx `server {}` block.
# Requires `deploy/nginx/admin_rate_limit.conf` to be included in `http {}`.

# Canonicalize `/admin` to `/admin/` for consistent browser behavior.
location = /admin {
    return 301 /admin/;
}

# Layer 2: nginx Basic Auth for all admin routes:
# /admin
# /admin/*
# /admin/ui/*
# /admin/api/*
location ^~ /admin/ {
    auth_basic "Restricted Admin Console";
    auth_basic_user_file /etc/nginx/.htpasswd_admin;

    # Generic anti-scanner / anti-enumeration limit.
    limit_req zone=admin_console_per_ip burst=20 nodelay;

    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Additional brute-force protection for login form submit endpoint.
location /admin/login {
    auth_basic "Restricted Admin Console";
    auth_basic_user_file /etc/nginx/.htpasswd_admin;

    limit_req zone=admin_login burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
